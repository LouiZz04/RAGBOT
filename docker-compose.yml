services:
  backend:
    build: ./src/backend
    container_name: ragbot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build: ./src/frontend
    container_name: ragbot-frontend
    ports:
      - "5174:5174"
    depends_on:
      - backend
